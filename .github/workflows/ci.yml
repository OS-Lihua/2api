name: CI

on:
  pull_request:
    types: [opened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Checkout the event commit in both jobs. A PR merge ref can disappear while
# queued runs start, and a base branch can advance after the merge event.
jobs:
  backend:
    name: Backend test (${{ matrix.name }})
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # PostgreSQL 14 is the minimum supported version.
          - name: postgres-14
            postgres: '14-alpine'
            clickhouse_log: false
            checks: false
          - name: postgres-18
            postgres: '18-alpine'
            clickhouse_log: false
            checks: true
          # Same primary database, with the log database on ClickHouse.
          - name: postgres-18-clickhouse-log
            postgres: '18-alpine'
            clickhouse_log: true
            checks: false
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:25.8-alpine
        env:
          CLICKHOUSE_PASSWORD: test
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
        ports:
          - 9000:9000
          - 8123:8123
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      GOWORK: 'off'
      # Tests reject non-loopback database hosts, so use 127.0.0.1, not localhost.
      TEST_POSTGRES_DSN: postgres://postgres:test@127.0.0.1:5432/postgres?sslmode=disable
      TEST_CLICKHOUSE_LOG_DSN: ${{ matrix.clickhouse_log && 'clickhouse://default:test@127.0.0.1:9000/default' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Vet root module
        if: matrix.checks
        run: go vet ./...

      - name: Vet relaykit independently
        if: matrix.checks
        working-directory: relaykit
        run: go vet ./...

      - name: Vet tokenkit independently
        if: matrix.checks
        working-directory: tokenkit
        run: go vet ./...

      - name: Build root module
        if: matrix.checks
        run: go build ./...

      - name: Build relaykit independently
        if: matrix.checks
        working-directory: relaykit
        run: go build ./...

      - name: Build tokenkit independently
        if: matrix.checks
        working-directory: tokenkit
        run: go build ./...

      - name: Test root, relaykit, and tokenkit modules
        env:
          GOFLAGS: '-timeout=35m'
        run: make test

  frontend:
    name: Frontend typecheck and test
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun check -b

      - name: Test
        run: bun run test
