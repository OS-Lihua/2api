name: CI

on:
  pull_request:
    types: [opened, synchronize, closed]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A merged PR close can share the same ref as the push it created.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Checkout the event commit in every job. A PR merge ref can disappear while
# queued runs start, and a base branch can advance after the merge event.
jobs:
  backend:
    name: Backend test (${{ matrix.database }}, ${{ matrix.suite }})
    # A push already tests merges to main.
    if: github.event.action != 'closed' ||
      (github.event.pull_request.merged == true && github.event.pull_request.base.ref != 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        database: [postgres-14, postgres-18, postgres-18-clickhouse-log]
        suite: [modules, router-native, router-text, router-other]
        include:
          # PostgreSQL 14 is the minimum supported version.
          - database: postgres-14
            postgres: '14-alpine'
            clickhouse_log: false
          - database: postgres-18
            postgres: '18-alpine'
            clickhouse_log: false
          # Same primary database, with the log database on ClickHouse.
          - database: postgres-18-clickhouse-log
            postgres: '18-alpine'
            clickhouse_log: true
          - database: postgres-18
            suite: modules
            checks: true
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:25.8-alpine
        env:
          CLICKHOUSE_PASSWORD: test
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
        ports:
          - 9000:9000
          - 8123:8123
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      GOWORK: 'off'
      # Tests reject non-loopback database hosts, so use 127.0.0.1, not localhost.
      TEST_POSTGRES_DSN: postgres://postgres:test@127.0.0.1:5432/postgres?sslmode=disable
      TEST_CLICKHOUSE_LOG_DSN: ${{ matrix.clickhouse_log && 'clickhouse://default:test@127.0.0.1:9000/default' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Vet root module
        if: matrix.checks
        run: go vet ./...

      - name: Vet relaykit independently
        if: matrix.checks
        working-directory: relaykit
        run: go vet ./...

      - name: Vet tokenkit independently
        if: matrix.checks
        working-directory: tokenkit
        run: go vet ./...

      - name: Build root module
        if: matrix.checks
        run: go build ./...

      - name: Build relaykit independently
        if: matrix.checks
        working-directory: relaykit
        run: go build ./...

      - name: Build tokenkit independently
        if: matrix.checks
        working-directory: tokenkit
        run: go build ./...

      - name: Run ${{ matrix.suite }} tests
        env:
          GOFLAGS: '-timeout=35m'
          TEST_SUITE: ${{ matrix.suite }}
        run: make "test-$TEST_SUITE"

  frontend:
    name: Frontend typecheck and test
    if: github.event.action != 'closed' ||
      (github.event.pull_request.merged == true && github.event.pull_request.base.ref != 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun check -b

      - name: Test
        run: bun run test
